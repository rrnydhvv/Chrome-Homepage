<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="pageTitle">New Tab</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="newtab.css">

    <!-- Helper IndexedDB -->
    <script src="db.js"></script>
    <!-- GỌI FILE LOAD NHANH Ở ĐÂY -->
    <script src="fast-load.js"></script>
</head>
<body>
    <button id="open-settings-btn" data-i18n="btnSettings">Settings</button>

    <div id="settings-panel">
        <div class="panel-header">
            <h3 data-i18n="panelTitle">Background Settings</h3>
            <button id="close-btn">X</button>
        </div>
        <input type="file" id="bg-upload" accept="image/*">
        
        <div class="slider-container">
            <div class="slider-header">
                <span data-i18n="labelZoom">Zoom</span>
                <div class="slider-input-group">
                    <input type="number" id="val-zoom" class="slider-number-input" min="10" max="1000" value="100">
                    <span>%</span>
                </div>
            </div>
            <input type="range" id="bg-zoom" min="10" max="300" value="100">
        </div>

        <div class="slider-container">
            <div class="slider-header">
                <span data-i18n="labelPanX">Pan X</span>
                <div class="slider-input-group">
                    <input type="number" id="val-pan-x" class="slider-number-input" min="0" max="100" value="50">
                    <span>%</span>
                </div>
            </div>
            <input type="range" id="bg-pan-x" min="0" max="100" value="50">
        </div>

        <div class="slider-container">
            <div class="slider-header">
                <span data-i18n="labelPanY">Pan Y</span>
                <div class="slider-input-group">
                    <input type="number" id="val-pan-y" class="slider-number-input" min="0" max="100" value="50">
                    <span>%</span>
                </div>
            </div>
            <input type="range" id="bg-pan-y" min="0" max="100" value="50">
        </div>

        <button id="reset-btn" data-i18n="btnReset">Reset</button>
    </div>

    <!-- GỌI FILE XỬ LÝ CÀI ĐẶT Ở ĐÂY -->
    <script src="newtab.js"></script>
</body>
</html>
